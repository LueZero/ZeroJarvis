[package]
name = "zerojarvis"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xcap = "0.0.14"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
base64 = "0.22"
chrono = "0.4"
